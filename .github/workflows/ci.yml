name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate frontend TypeScript
        working-directory: frontend
        run: npx tsc -b --noEmit

  playwright:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --reporter=line

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    env:
      ACTIONLINT_VERSION: '1.7.12'
      # SHA-256 of actionlint_1.7.12_linux_amd64.tar.gz, taken from the release's
      # own actionlint_1.7.12_checksums.txt.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      SHELLCHECK_VERSION: '0.11.0'
      # ShellCheck publishes no checksum file, so this digest is pinned from the
      # official shellcheck-v0.11.0.linux.x86_64.tar.xz release artifact.
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install actionlint and ShellCheck
        shell: bash
        run: |
          set -Eeuo pipefail
          tools_dir="$RUNNER_TEMP/workflow-lint"
          install -d "$tools_dir/bin"

          actionlint_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --retry-delay 2 --output "$tools_dir/actionlint.tar.gz" "$actionlint_url"
          echo "${ACTIONLINT_SHA256}  $tools_dir/actionlint.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$tools_dir/actionlint.tar.gz" --directory "$tools_dir/bin" actionlint

          shellcheck_url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 --retry-delay 2 --output "$tools_dir/shellcheck.tar.xz" "$shellcheck_url"
          echo "${SHELLCHECK_SHA256}  $tools_dir/shellcheck.tar.xz" | sha256sum --check --strict
          tar --extract --xz --file "$tools_dir/shellcheck.tar.xz" --directory "$tools_dir/bin" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"

          chmod +x "$tools_dir/bin/actionlint" "$tools_dir/bin/shellcheck"
          "$tools_dir/bin/actionlint" --version
          "$tools_dir/bin/shellcheck" --version | head -n 2
          echo "$tools_dir/bin" >> "$GITHUB_PATH"

      - name: Lint workflow files
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v actionlint
          command -v shellcheck

          shopt -s nullglob
          workflow_files=(.github/workflows/*.yml .github/workflows/*.yaml)
          if [ "${#workflow_files[@]}" -eq 0 ]; then
            echo "::error::No workflow files found under .github/workflows." >&2
            exit 1
          fi
          printf 'Linting %s\n' "${workflow_files[@]}"

          log="$RUNNER_TEMP/actionlint.log"
          if ! actionlint -no-color -verbose "${workflow_files[@]}" >"$log" 2>&1; then
            cat "$log"
            exit 1
          fi
          cat "$log"

          # A silent ShellCheck miss would let this job pass without linting the
          # run: scripts, so treat it as a hard failure.
          if grep -q 'shellcheck.*was disabled' "$log"; then
            echo "::error::actionlint ran without ShellCheck; the shell scripts were not linted." >&2
            exit 1
          fi
          echo "All workflow files linted with actionlint and ShellCheck."
